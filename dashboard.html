<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-500">
    <div class="w-full h-[21rem] border bg-[url(./img/skyscraper_1112-1088.avif)] bg-no-repeat bg-cover bg-center blur-[3px]">
    </div>
    <div class="w-3/4 h-[30rem] border absolute top-[100px] ms-[200px] bg-white rounded-3xl">
        <div class="w-[11rem] h-[11rem] bg-red-300 mx-auto -mt-[50px] rounded-full overflow-hidden">
            <img src="./img/Untitled design.png" id="dash_img" class="w-full h-full object-cover rounded-full">
        </div>
        <div class="p-4 mt-2 flex flex-col justify-center items-center border gap-4">
            <h1 class="text-start text-4xl font-semibold  text-gray-500">Name : <span id="dash_name">Huzaifa Asif</span></h1>
            <h1 class="text-start text-2xl font-semibold text-gray-500">Email : <span id="dash_email">etc@gmail.com</span></h1>
            <h1 class="text-start text-2xl font-semibold text-gray-500">User ID : <span id="dash_id">12345</span></h1>
            <button id="signout" class="px-[40px] py-3 active:scale-95 font-semibold text-[20px] text-white bg-red-500 rounded-[10px] outline-none border-none">Logout</button>
        </div>
    </div>
    <script src="./js/dashboard.js" type="module"></script>
</body>
</html>
