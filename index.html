<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart SignUp Page Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center h-screen bg-gray-800">

    <div class="w-1/3 h-[390px] border text-center border-2 px-4 rounded-lg bg-sky-400/30 border-sky-500">
        <h1 class="text-center mt-2 text-2xl font-bold text-white">SignUp Form</h1>
        <form id="signup" class="flex flex-col">
            <label for="semail" class="font-semibold text-white text-start">Email :</label>
            <input type="email" id="semail" class="px-3 py-2 mb-5 mt-2 bg-transparent outline-none border border-sky-500 text-white focus:ring-1 ring-blue-300 rounded-[5px]" placeholder="Enter your email" required>
            <label for="spassword"  class="font-semibold text-white text-start">Password :</label>
            <input type="password" id="spassword"  class="px-3 py-2 mb-5 mt-2 outline-none bg-transparent border border-sky-500 focus:ring-1 ring-blue-300 rounded-[5px]" placeholder="Enter your password" required>
            <button type="btn" id="signupBtn" class="px-3 py-2 text-semibold bg-blue-300 hover:bg-blue-400 transition duration-300 rounded-[5px] text-white">SignUp</button>
        </form>
        <div class="flex  mt-5 items-center h-[3px] gap-2">
            <span class="w-[300px] h-[1px] border "></span>
            <span class="text-white mb-1">or</span>
            <span class="w-[300px] h-[1px] border "></span>
        </div>
        <button id="googleBtn" class="flex mb-1 outline-none items-center gap-2 border px-4 py-2  bg-white mx-auto mt-[15px] rounded-lg hover:bg-gray-100">
        <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.73 1.22 9.24 3.6l6.9-6.9C35.64 2.4 30.2 0 24 0 14.82 0 6.73 5.48 2.69 13.44l8.04 6.24C12.64 13.1 17.88 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.64-.14-3.2-.4-4.7H24v9h12.44c-.54 2.92-2.2 5.4-4.7 7.06l7.28 5.66C43.98 37.44 46.1 31.54 46.1 24.5z"/>
            <path fill="#FBBC05" d="M10.73 28.68a14.5 14.5 0 010-9.36l-8.04-6.24A23.9 23.9 0 000 24c0 3.84.92 7.46 2.69 10.56l8.04-5.88z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.9-2.14 15.86-5.82l-7.28-5.66c-2.02 1.36-4.6 2.16-8.58 2.16-6.12 0-11.36-3.6-13.27-8.78l-8.04 5.88C6.73 42.52 14.82 48 24 48z"/>
        </svg>
        Continue with Google
        </button>
        <a href="./login.html" class="text-red-500 font-semibold">Login Now....</a>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
